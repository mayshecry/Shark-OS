insmod all_video

set timeout=5
set default=0
set gfxmode=1920x1080x32,1280x720x32,1024x768x32,auto
set gfxpayload=keep

menuentry "SharkOS (32-bit kernel - boots on i686 and x86_64)" {
	multiboot /boot/sharkos.bin
}

menuentry "SharkOS (Safe Mode - 1024x768)" {
	set gfxmode=1024x768x32,auto
	set gfxpayload=keep
	multiboot /boot/sharkos.bin
}