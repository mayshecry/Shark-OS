insmod all_video

set timeout=5
set default=0
set gfxmode=1920x1080x32,1280x720x32,1024x768x32,auto
set gfxpayload=keep


menuentry "SharkOS" {
    multiboot /boot/sharkos.bin
}

menuentry "SharkOS Lite" {
    multiboot /boot/sharkos.bin lite
}

menuentry "SharkOS Legacy" {
    multiboot /boot/sharkos.bin legacy
}
