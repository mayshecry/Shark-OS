timeout: 5
default_entry: 1
graphics: yes
verbose: yes
interface_resolution: 1024x768

/SharkOS
    protocol: multiboot1
    kernel_path: boot():/boot/sharkos.bin

/SharkOS Lite
    protocol: multiboot1
    kernel_path: boot():/boot/sharkos.bin
    cmdline: lite

/SharkOS Legacy
    protocol: multiboot1
    kernel_path: boot():/boot/sharkos.bin
    cmdline: legacy

/SharkOS Kawaii
    protocol: multiboot1
    kernel_path: boot():/boot/sharkos.bin
    cmdline: kawaii